<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rasheedah Prioleau | American Specter Series</title>
<meta name="description" content="Interactive ghost stories from the American Specter Series by Rasheedah Prioleau.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="hero">
  <div class="series" id="series"></div>
  <h1 id="pen"></h1>
  <p id="tagline"></p>
</header>
<main class="wrap">
  <section><h2>The Novels</h2><div class="cards" id="cards"></div></section>
  <section><h2>About the Author</h2><p id="bio"></p></section>
</main>
<footer>&copy; <span id="year"></span> <span id="pen2"></span>. All rights reserved.</footer>
<script src="novels/library.js"></script>
<script>
var S = window.SITE;
function t(id, v){ document.getElementById(id).textContent = v; }
t('series', S.series); t('pen', S.penName); t('pen2', S.penName);
t('tagline', S.tagline); t('bio', S.bio); t('year', new Date().getFullYear());
var cards = document.getElementById('cards');
S.novels.forEach(function(n){
  var c = document.createElement('div'); c.className = 'card';
  var h = document.createElement('h3'); h.textContent = n.title;
  var m = document.createElement('div'); m.className = 'meta'; m.textContent = n.book + ' · ' + n.length;
  var p = document.createElement('p'); p.textContent = n.blurb;
  var a = document.createElement('a'); a.className = 'btn'; a.textContent = 'Read'; a.href = 'reader.html?novel=' + encodeURIComponent(n.slug);
  c.append(h, m, p, a); cards.appendChild(c);
});
</script>
</body>
</html>
